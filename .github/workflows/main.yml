name: Build AimLock V2 Premium

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Android project
        shell: bash
        run: |
          echo "=== PROJECT ==="
          pwd
          echo "=== FILES ==="
          find . -maxdepth 3 -type f | sort

          test -f settings.gradle || {
            echo "ERROR: Missing settings.gradle"
            exit 1
          }

          test -f build.gradle || {
            echo "ERROR: Missing build.gradle"
            exit 1
          }

          test -d app || {
            echo "ERROR: Missing app directory"
            exit 1
          }

          test -f app/build.gradle || {
            echo "ERROR: Missing app/build.gradle"
            exit 1
          }

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Gradle version
        run: gradle --version

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Check APK
        shell: bash
        run: |
          echo "=== APK ==="
          find app/build/outputs -type f -name "*.apk" -print

          test -f app/build/outputs/apk/debug/app-debug.apk || {
            echo "ERROR: APK was not created"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimLock-V2-Premium-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
